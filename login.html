
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | HabitBloom</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">

            <a class="navbar-brand brand-name" href="index.html">
                <span class="brand-flower">❀</span>
                HabitBloom
            </a>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>
    </nav>


    <!-- LOGIN SECTION -->
    <section class="auth-section">

        <div class="container">

            <div class="auth-wrapper">

                <!-- IMAGE SIDE -->
                <div class="auth-image-side">

                    <img src="images/login-bloom.jpg" alt="Pink lotus flower">
                   
                </div>


                <!-- FORM SIDE -->
                <div class="auth-form-side">

                    <div class="auth-heading">

                        <span class="auth-flower">✿</span>

                        <h1>Welcome Back</h1>

                        <p>
                            Login to continue your HabitBloom journey.
                        </p>

                    </div>


                    <form action="#" method="post">

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control custom-input"
                                   id="email"
                                   name="email"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control custom-input"
                                   id="password"
                                   name="password"
                                   placeholder="Enter your password"
                                   required>

                        </div>


                        <div class="login-options">

                            <div class="form-check">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="remember">

                                <label class="form-check-label"
                                       for="remember">
                                    Remember me
                                </label>

                            </div>

                            <a href="#" class="forgot-link">
                                Forgot Password?
                            </a>

                        </div>


                        <button type="submit"
                                class="btn btn-maroon login-button">
                            Login
                        </button>


                        <p class="signup-text">
                            Don't have an account?
                            <a href="signup.html">Create an account</a>
                        </p>

                    </form>

                </div>

            </div>

        </div>

    </section>


    <footer class="auth-footer">
        © 2026 HabitBloom. Small steps. Beautiful growth.
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
